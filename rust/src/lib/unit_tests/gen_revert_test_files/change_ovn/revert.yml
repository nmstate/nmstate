---
interfaces:
- name: eth3
  type: ethernet
  state: up
- name: ovsbr3
  type: ovs-bridge
  state: absent
- name: ovsbr3
  type: ovs-interface
  state: absent
ovn:
  bridge-mappings:
    - localnet: green
      state: absent
    - localnet: blue
      bridge: ovsbr1
    - localnet: red
      bridge: ovsbr2
