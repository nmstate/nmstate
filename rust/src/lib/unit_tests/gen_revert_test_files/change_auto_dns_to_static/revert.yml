---
routes:
  config:
  - state: absent
    destination: ::/0
    next-hop-interface: eth1
    next-hop-address: 2001:db8:1::3
    metric: 1024
    table-id: 254
  - state: absent
    destination: 0.0.0.0/0
    next-hop-interface: eth1
    next-hop-address: 192.0.2.1
    metric: 0
    table-id: 254
interfaces:
  - name: eth1
    type: ethernet
    state: up
    ipv4:
      dhcp: true
      enabled: true
      address: []
      auto-dns: true
      auto-gateway: true
      auto-routes: true
    ipv6:
      dhcp: true
      enabled: true
      autoconf: true
      address: []
      auto-dns: true
      auto-gateway: true
      auto-routes: true
