conn site_to_site_ipv4
    auto=up
    hostaddrfamily=ipv4
    left=192.0.2.1
    leftid=%fromcert
    leftcert=ipsec-srv.example.org
    leftsubnets=10.0.0.0/24,10.1.0.0/24
    leftsendcert=always
    leftmodecfgserver=no
    rightmodecfgclient=no
    right=192.0.2.2
    rightid=@cli-a.example.org
    rightca=%same
    rightrsasigkey=%cert
    rightsubnets=10.0.9.0/24,10.0.10.0/24
    ikev2=insist

conn site_to_site_ipv6
    auto=up
    hostaddrfamily=ipv6
    left=2001:db8:a::1
    leftid=%fromcert
    leftcert=ipsec-srv.example.org
    leftsubnets=fd00:a::/64,fd00:b::/64
    leftsendcert=always
    leftmodecfgserver=no
    rightmodecfgclient=no
    right=2001:db8:a::2
    rightid=@cli-a.example.org
    rightca=%same
    rightrsasigkey=%cert
    rightsubnets=fd00:9::/64,fd00:10::/64
    ikev2=insist
